[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emfs_validation"
version = "0.1.0"
description = "Validation of embedded-filesystem on boards"
requires-python = ">=3.10"
# ad3-waveforms-bench brings the terminal client and its pytest plugin (--no-ad3, --fake); validation needs no Analog Discovery
dependencies = [
    "ad3-waveforms-bench @ git+https://github.com/embedded-pro/ad3-waveforms-bench@52af3ed368979172dd1b2d1ebc0db0f52cb68527",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "pytest>=7.4",
    "pytest-bdd>=9.0,<10",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["emfs_validation*"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
bdd_features_base_dir = "tests/hil/features"
markers = [
    "hil: runs against the firmware of a board, or against the fake firmware with --fake (skipped without --port or --fake)",
]
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
