---
name: Update embedded-pro/hal-st Git Tag

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_git_tag:
    name: Update git tag and create PR when changed
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN  }}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull latest hash
        id: pull_head
        run: |
          current_hash="$(sed -n 's/.*GIT_TAG *\([0-9a-f]\{40\}\) # Unreleased.*/\1/p' validation/CMakeLists.txt)"
          if [ -z "$current_hash" ]; then
            echo "::error file=validation/CMakeLists.txt::no GIT_TAG <sha> # Unreleased for hal-st"
            exit 1
          fi
          git clone --quiet --filter=blob:none --no-checkout https://github.com/embedded-pro/hal-st.git "$RUNNER_TEMP/hal-st"
          latest_hash="$(git -C "$RUNNER_TEMP/hal-st" rev-parse HEAD)"

          git_log="$(git -C "$RUNNER_TEMP/hal-st" log --oneline --format="%s" "$current_hash".."$latest_hash")"

          echo "current_hash=$current_hash"
          echo "latest_hash =$latest_hash"
          echo "$git_log"

          {
            echo "current_hash=$current_hash"
            echo "latest_hash=$latest_hash"
            echo "git_log<<EOF"
            echo "$git_log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update validation/CMakeLists.txt
        if: ${{ steps.pull_head.outputs.current_hash != steps.pull_head.outputs.latest_hash }}
        run: |
          sed -i 's/${{ steps.pull_head.outputs.current_hash }}/${{ steps.pull_head.outputs.latest_hash }}/g' validation/CMakeLists.txt

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.FOREST_RELEASER_APP_ID }}
          private-key: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ steps.pull_head.outputs.current_hash != steps.pull_head.outputs.latest_hash }}
        with:
          token: ${{ steps.token.outputs.token }}
          branch: update-hal-st-git-tag
          commit-message: "chore: update embedded-pro/hal-st hash to ${{ steps.pull_head.outputs.latest_hash }}"
          title: "chore: update embedded-pro/hal-st hash to ${{ steps.pull_head.outputs.latest_hash }}"
          body: |
            commits on embedded-pro/hal-st:

            ```
            ${{ steps.pull_head.outputs.git_log }}
            ```
